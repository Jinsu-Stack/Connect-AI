<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Group Chat</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            height: 90vh;
        }

        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .sidebar h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .rooms-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .room-item {
            padding: 10px;
            margin-bottom: 8px;
            background: #f5f5f5;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .room-item:hover {
            background: #667eea;
            color: white;
        }

        .room-item.active {
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        .setup-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #667eea;
        }

        .setup-section h4 {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 10px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            font-family: inherit;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .main-chat {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 2px solid #f0f0f0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0;
        }

        .chat-header h2 {
            margin-bottom: 5px;
        }

        .participants-info {
            font-size: 13px;
            opacity: 0.9;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.system {
            justify-content: center;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
        }

        .message.ai .message-content {
            background: #e3f2fd;
            color: #333;
            border-left: 4px solid #667eea;
        }

        .message.system .message-content {
            background: #fff9c4;
            color: #666;
            font-size: 13px;
            font-style: italic;
        }

        .message-sender {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .message.ai .message-sender {
            color: #667eea;
        }

        .chat-input-area {
            padding: 20px;
            border-top: 2px solid #f0f0f0;
            background: white;
            border-radius: 0 0 12px 12px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #sendBtn {
            padding: 12px 24px;
            background: #667eea;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #sendBtn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        #sendBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }

        .status.connected {
            color: #4caf50;
            font-weight: bold;
        }

        .status.disconnected {
            color: #f44336;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .sidebar {
                display: none;
            }

            .message-content {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="setup-section">
                <h4>👤 Your Name</h4>
                <div class="input-group">
                    <input type="text" id="userNameInput" placeholder="Enter your name" value="You">
                </div>

                <h4 style="margin-top: 15px;">🤖 Create Room</h4>
                <div class="input-group">
                    <input type="text" id="roomNameInput" placeholder="Room name">
                </div>
                <div class="input-group">
                    <input type="number" id="maxParticipants" placeholder="Max participants" value="10" min="2" max="50">
                </div>
                <button onclick="createRoom()">Create Room</button>

                <h4 style="margin-top: 15px;">🤖 Add AI Agent</h4>
                <div class="input-group">
                    <input type="text" id="aiNameInput" placeholder="Agent name" value="Assistant">
                </div>
                <div class="input-group">
                    <select id="aiPersonalitySelect">
                        <option value="Strategist">Strategist</option>
                        <option value="Empathetic Visionary">Empathetic Visionary</option>
                        <option value="Skeptical Nihilist">Skeptical Nihilist</option>
                    </select>
                </div>
                <button onclick="addAIAgent()">Add AI Agent</button>
                <div id="aiAgentsList" style="margin-top: 15px; font-size: 12px; color: #666;"></div>
            </div>

            <h3 style="margin-top: 20px;">📋 Rooms</h3>
            <div class="rooms-list" id="roomsList"></div>

            <div class="status" id="status">Connecting...</div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <h2 id="roomTitle">Select or Create a Room</h2>
                <div class="participants-info">
                    Participants: <span id="participantCount">0</span>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer"></div>

            <div id="aiResponsePrompt" style="display: none; padding: 15px; background: #f0f0f0; border-top: 2px solid #ddd;">
                <div style="margin-bottom: 10px; font-weight: bold;">Which AI agents should respond?</div>
                <div id="aiAgentCheckboxes" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px;"></div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="requestAIResponses()" style="flex: 1; background: #667eea;">Request Responses</button>
                    <button onclick="askMoreQuestions()" style="flex: 1; background: #764ba2;">Ask More</button>
                </div>
            </div>

            <div class="chat-input-area" id="inputArea" style="display: none;">
                <div class="input-wrapper">
                    <input type="text" id="messageInput" placeholder="Type your message... (press Enter to send)">
                    <button id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
